{% extends 'account/base_auth.html' %}
{% load i18n %}

{% block title %}Sign Out - GearGo{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="text-center mb-4">
                <i class="fas fa-sign-out-alt fa-3x text-primary mb-3"></i>
                <h2 class="h4 mb-2">Sign Out</h2>
                <p class="text-muted">Are you sure you want to sign out?</p>
            </div>
            
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form method="post" action="{% url 'account_logout' %}">
                        {% csrf_token %}
                        {% if redirect_field_value %}
                            <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
                        {% endif %}
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-out-alt me-2"></i>Sign Out
                            </button>
                            <a href="{% url 'marketplace:home' %}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
